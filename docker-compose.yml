name: gitweave

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-gitweave}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-gitweave}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-gitweave}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: loads the committed fixture so the dashboard is populated in
  # ~60s with no GitHub token. Live sync layers on top once a token exists.
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args: { APP: ingest }
    restart: "no"
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-gitweave}:${MONGO_INITDB_ROOT_PASSWORD:-gitweave}@mongo:27017/${MONGODB_DB_NAME:-gitweave}?authSource=admin
      REDIS_URL: redis://redis:6379
      FIXTURE_PATH: /app/fixtures/posthog-90d.json.gz
    volumes:
      - ./fixtures:/app/fixtures:ro
    depends_on:
      mongo: { condition: service_healthy }
    command: ["node", "dist/cli.js", "seed"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args: { APP: api }
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-gitweave}:${MONGO_INITDB_ROOT_PASSWORD:-gitweave}@mongo:27017/${MONGODB_DB_NAME:-gitweave}?authSource=admin
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
    ports: ["4000:4000"]
    depends_on:
      mongo: { condition: service_healthy }
      seed:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
      args: { APP: ingest }
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-gitweave}:${MONGO_INITDB_ROOT_PASSWORD:-gitweave}@mongo:27017/${MONGODB_DB_NAME:-gitweave}?authSource=admin
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    environment:
      # The browser cannot resolve `api`, so server-side and client-side URLs differ.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  mongo-data:
  redis-data:
